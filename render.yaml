services:
  - type: web
    name: interviewer
    runtime: node
    plan: free
    buildCommand: npm --prefix frontend install && npm --prefix frontend run build
    startCommand: node backend/server.js
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: PORT
        value: 10000
      # Generated per-deployment by Render, so no secret lives in the repo.
      - key: JWT_SECRET
        generateValue: true
